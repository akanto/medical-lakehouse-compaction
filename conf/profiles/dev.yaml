# Local development against Docker MinIO. See experiment.yaml for what each
# setting means.
warehouse: "s3a://dicom-lakehouse/warehouse"
endpoint: "http://localhost:9000"
access_key: "minioadmin"
secret_key: "minioadmin"
n_series: 10
target_file_size_mb: 256
uid_metrics_truncate: 64
latency_ms: [1, 10, 25, 50]
benchmark_runs: 5
w2_n_batches: 1
w2_batch_series: 30
event_log_dir: "results/eventlog"
