# The paper's campaign: 200 series over the full network grid.
#
# endpoint / tsg_host / minio_ping_host are deploy-specific and are NOT stored
# here. `make configure` reads them from `terraform output -json` and writes
# experiment.local.yaml, which the run targets use and .gitignore excludes.

warehouse: "s3a://dicom-lakehouse/warehouse"
access_key: "minioadmin"
secret_key: "minioadmin"

n_series: 200

# Iceberg's write.target-file-size-bytes for the compacted layouts, in MB.
target_file_size_mb: 256

# Manifest bound length for the two UID columns (series_instance_uid,
# sop_instance_uid). 64 is the full DICOM UID, so manifest pruning is exact;
# Iceberg's default of 16 truncates every UID to its shared prefix. The
# setting rides table creation, so changing it means rebuilding the tables and
# re-running the whole campaign — a build must never mix the two. Set to null
# to measure the default instead.
uid_metrics_truncate: 64

# Local mode: the driver is the whole cluster. Native memory grows on top of
# the heap over a long row, so this is paired with one JVM per rate row
# (scripts/run_rows.sh); raising it without splitting the rows does not help.
driver_memory: "12g"

# The grid: 3 bandwidth limits x 5 injected round-trip times = 15 cells.
# Execution order is this order — rate outer, latency inner — so an early stop
# costs the most expensive points rather than the whole result.
rate_gbit: [5, 2, 1]
latency_ms: [0, 2, 5, 10, 25]

# Repetitions per workload per cell. Entries per cell =
# 4 strategies x (w1_n_series + 2) x benchmark_runs = 84.
benchmark_runs: 3

# W1 reads one series per selected UID, benchmark_runs times, per cell. The
# selection spans the slice-count distribution; it is the population sample,
# not the replicate set.
w1_n_series: 5

# W2 loads one patient-level shard: w2_batch_series series drawn at random,
# read whole. Must stay under Iceberg's IN_PREDICATE_LIMIT of 200, above which
# InclusiveMetricsEvaluator stops evaluating the IN list against manifest
# bounds and pruning silently stops.
w2_n_batches: 1
w2_batch_series: 50

# Shards are drawn with seed w2_seed + run_index: identical across cells and
# strategies, so request counts stay comparable; different per repetition.
w2_seed: 42

# One discarded unshaped pass before the grid, for JVM and S3A warm-up.
warmup: true

tsg_ssh_user: "ubuntu"

# Stage-level telemetry. Unset means no event log. The SparkUI stays disabled
# either way, which is why scan_tasks must come from the event log rather than
# from sc.uiWebUrl.
event_log_dir: "results/eventlog"
