# Structural-cost run: one unshaped cell, used to capture request counts and
# wire bytes with an event log attached. Shaping changes timing, not the query
# plan, so the structural counters need only one cell. See experiment.yaml for
# what each setting means.
#
# endpoint / tsg_host / minio_ping_host come from `make configure`.
warehouse: "s3a://dicom-lakehouse/warehouse"
access_key: "minioadmin"
secret_key: "minioadmin"
n_series: 200
target_file_size_mb: 256
uid_metrics_truncate: 64
driver_memory: "12g"
rate_gbit: ["none"]
latency_ms: [0]
benchmark_runs: 3
w1_n_series: 5
w2_n_batches: 1
w2_batch_series: 50
w2_seed: 42
warmup: true
tsg_ssh_user: "ubuntu"
event_log_dir: "results/eventlog"
