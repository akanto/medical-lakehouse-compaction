# Exploratory sweep at the two extremes of the bandwidth range, one repetition,
# used to choose the campaign's latency grid. See experiment.yaml for what each
# setting means.
#
# endpoint / tsg_host / minio_ping_host come from `make configure`.
warehouse: "s3a://dicom-lakehouse/warehouse"
access_key: "minioadmin"
secret_key: "minioadmin"
n_series: 200
target_file_size_mb: 256
uid_metrics_truncate: 64
driver_memory: "12g"
rate_gbit: ["none", 1]
latency_ms: [0, 2, 5, 10, 25]
benchmark_runs: 1
w1_n_series: 3
w2_n_batches: 1
w2_batch_series: 30
w2_seed: 42
warmup: true
tsg_ssh_user: "ubuntu"
