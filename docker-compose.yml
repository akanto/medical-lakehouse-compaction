services:
  minio:
    # SILO, PGSTY's community-maintained AGPL fork of MinIO, replaced MinIO.
    # The MinIO community edition is archived, and the release of the earlier
    # campaign (RELEASE.2024-11-07T00-52-20Z) is no longer served by Docker
    # Hub, quay.io or dl.min.io. Pinned by digest, which
    # covers linux/amd64 (AWS) and linux/arm64 (local). SILO reads the same
    # MINIO_* variables, translates the `server` command, and bundles the
    # client as both `mcli` and `mc`. The service and the container keep the
    # name `minio`, which the Makefile and the profiles address.
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: create the warehouse bucket so a fresh volume is usable without
  # a manual `mc mb`. Exits 0 after the bucket exists (idempotent). It reuses
  # the server image, which bundles the client, so one digest pins both.
  createbuckets:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/dicom-lakehouse &&
      echo 'bucket dicom-lakehouse ready';
      exit 0;
      "

volumes:
  minio_data:
